tick:
  name: Tick
  description: Change the entities that have no service of their own (sensors, binary sensor, event, device tracker).
  fields:
    count:
      name: Ticks
      description: How many ticks to send.
      default: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box

flap:
  name: Flap availability
  description: Make every hri_probe entity unavailable, then available again.
  fields:
    seconds:
      name: Seconds
      description: How long the entities stay unavailable.
      default: 5
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: s

notify:
  name: Persistent notification
  description: Create or dismiss a persistent notification.
  fields:
    title:
      name: Title
      default: HRI Probe
      selector:
        text:
    message:
      name: Message
      default: Persistent notification from hri_probe.
      selector:
        text:
          multiline: true
    notification_id:
      name: Notification id
      description: Same id replaces the previous notification.
      default: hri_probe_manual
      selector:
        text:
    dismiss:
      name: Dismiss
      description: Dismiss the notification with that id instead of creating it.
      default: false
      selector:
        boolean:

echo:
  name: Echo
  description: Answer with the payload it was called with (a service that returns a response).
  fields:
    payload:
      name: Payload
      description: Any JSON object; it comes back in the response.
      selector:
        object:
    words:
      name: Words
      description: A list of strings; an item may contain a comma.
      example: "Smith, John"
      selector:
        text:
          multiple: true
    names:
      name: Names
      description: A multi-select that takes typed values; the example holds items the options do not list, one with a comma and one with surrounding spaces.
      example: ["alpha", "Smith, John", "  padded  "]
      selector:
        select:
          options:
            - alpha
            - beta
          multiple: true
          custom_value: true

fail:
  name: Fail
  description: Raise an error, to check how a failed call is reported.
  fields:
    message:
      name: Message
      default: hri_probe.fail was called
      selector:
        text:

slow:
  name: Slow call
  description: Take longer than the caller's timeout.
  fields:
    seconds:
      name: Seconds
      default: 90
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: s

stuck:
  name: Block an executor thread
  description: Test case - one executor thread waits forever.

expire_auth:
  name: Expire the authentication
  description: Make the config entry fail authentication, so Home Assistant starts the reauth flow.
  fields:
    entry_id:
      name: Entry id
      default: ""
      selector:
        text:
